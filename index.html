<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seminar Topic Registration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#17231c;--mut:#5d6b63;--pri:#1f6b45;--bd:#d6dfda;--bad:#b3261e;--ok:#1f6b45}
@media(prefers-color-scheme:dark){:root{--bg:#111815;--card:#1a2420;--tx:#e8f0eb;--mut:#9baba2;--pri:#4fb583;--bd:#2d3b35;--bad:#ff8a80;--ok:#4fb583}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:860px;margin:auto}
h1{font-size:18px;margin:4px 0}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--tx);width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto;padding:10px 16px}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.d{background:var(--bad)}button.m{padding:5px 9px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1 1 140px}
.who{font-size:13px;min-height:18px;margin-top:4px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.b-on{background:#d8f0e2;color:#14532d}.b-off{background:#fde2e0;color:#8c1d18}
.t{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
.t input{width:auto;margin-top:3px}.t.off{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.t em{margin-left:auto;font-size:12px;color:var(--bad);font-style:normal;white-space:nowrap}
.t:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.slip{border:2px dashed var(--pri);border-radius:12px;padding:16px;text-align:center}
.slip .id{font:700 22px monospace;color:var(--pri)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:8px}.stats b{font-size:20px;display:block}
.hide{display:none}a{color:var(--pri)}
</style>
</head>
<body>
<h1>Seminar Topic Registration</h1>
<div class="sub">UAZ4MC01 · Environmental Biology · II UG (25-UAZ) · Loyola College</div>

<!-- STUDENT -->
<div id="stu">
  <div id="regView">
    <div class="card" id="banner"></div>
    <div class="card">
      <h2>Register your team (2 students)</h2>
      <label class="f">Your register number</label>
      <input id="r1" placeholder="25-UAZ-001" autocapitalize="characters" autocomplete="off">
      <div class="who" id="w1"></div>
      <label class="f">Partner's register number</label>
      <input id="r2" placeholder="25-UAZ-002" autocapitalize="characters" autocomplete="off">
      <div class="who" id="w2"></div>
      <label class="f">Choose a topic (no changes after confirming)</label>
      <div id="topics"></div>
      <div class="who bad" id="serr"></div>
      <button id="go" style="width:100%;margin-top:8px">Confirm registration</button>
    </div>
    <div class="card">
      <h2>Check my status</h2>
      <div class="row" style="margin-top:0"><input id="cr" placeholder="25-UAZ-001" autocapitalize="characters"><button class="s" id="chk">Check</button></div>
      <div id="cres" class="who"></div>
    </div>
  </div>
  <div id="confView" class="hide"></div>
</div>

<!-- ADMIN -->
<div id="adm" class="hide">
  <div id="login" class="card">
    <h2>Admin login</h2>
    <label class="f">Role</label>
    <select id="role"><option value="admin">Admin</option><option value="leader">Class Leader</option><option value="staff">Staff In-charge</option></select>
    <label class="f">Passcode</label><input id="pass" type="password">
    <div class="who bad" id="lerr"></div>
    <button id="lbtn" style="margin-top:8px">Login</button>
  </div>
  <div id="panel" class="hide"></div>
</div>

<p class="sub" style="text-align:center"><a href="#" id="sw">Admin</a></p>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzCAXb_K-CnNCGo1q6xfiiIwKqCW_TLD5mNJ_VwKkOiVWcPKV6PC1ZR7Oytb92f4TC-/exec';   // <-- Apps Script web app URL
const $ = i => document.getElementById(i);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => t ? new Date(+t).toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'}) : '—';
const toLocal = t => t ? new Date(+t - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16) : '';
async function api(b){
  const r = await fetch(API, {method:'POST', body:JSON.stringify(b)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error); return j;
}
function route(){
  const a = location.hash === '#admin';
  $('stu').classList.toggle('hide', a); $('adm').classList.toggle('hide', !a);
  $('sw').textContent = a ? 'Student page' : 'Admin'; $('sw').href = a ? '#' : '#admin';
}
addEventListener('hashchange', route); route();

/* ---------- STUDENT ---------- */
let ST = null, sel = null;
async function load(){
  try{ ST = await api({action:'state'}); drawStudent(); }
  catch(e){ $('banner').innerHTML = '<span class="bad">Cannot reach server: '+esc(e.message)+'</span>'; }
}
function drawStudent(){
  const s = ST;
  let note = s.mode==='auto' ? (s.open ? 'Closes '+fmt(s.closeAt) : (s.openAt && Date.now()<s.openAt ? 'Opens '+fmt(s.openAt) : 'Registration has ended')) : '';
  $('banner').innerHTML = '<span class="badge '+(s.open?'b-on':'b-off')+'">'+(s.open?'Registration OPEN':'Registration CLOSED')+'</span> '
    + '<span class="sub">'+esc(note)+' · '+s.teams+'/'+s.total+' teams registered</span>';
  $('topics').innerHTML = s.topics.map(t =>
    '<label class="t '+(t.taken?'off':'')+'"><input type="radio" name="tp" value="'+t.no+'" '+(t.taken?'disabled':'')+(sel==t.no&&!t.taken?' checked':'')+'><span>'+t.no+'. '+esc(t.name)+'</span>'+(t.taken?'<em>Taken</em>':'')+'</label>').join('');
  $('go').disabled = !s.open;
}
$('topics').addEventListener('change', e => sel = e.target.value);
async function who(inp, out, other){
  const el = $(out), v = $(inp).value.trim(); if(!v){ el.textContent=''; return; }
  try{
    const r = await api({action:'lookup', reg:v}); $(inp).value = r.reg;
    el.className = 'who ' + (r.team ? 'bad' : 'ok');
    el.textContent = r.name + (r.team ? ' — already in a team ('+r.team.topic+')' : ' ✓');
  }catch(e){ el.className='who bad'; el.textContent = e.message; }
}
$('r1').onchange = () => who('r1','w1'); $('r2').onchange = () => who('r2','w2');
$('go').onclick = async () => {
  $('serr').textContent = '';
  if(!sel) return $('serr').textContent = 'Please choose a topic.';
  const b = $('go'); b.disabled = true; b.textContent = 'Registering…';
  try{
    const r = await api({action:'register', reg1:$('r1').value, reg2:$('r2').value, topicNo:sel});
    showConfirm(r.team);
  }catch(e){ $('serr').textContent = e.message; load(); }
  b.textContent = 'Confirm registration'; b.disabled = false;
};
function showConfirm(t){
  $('regView').classList.add('hide'); const c = $('confView'); c.classList.remove('hide');
  c.innerHTML = '<div class="card slip"><div class="ok" style="font-weight:700">✓ Registration confirmed</div>'
   + '<div class="id">'+t.id+'</div><h2 style="margin-top:10px">'+esc(t.topic)+'</h2>'
   + '<p>'+esc(t.m1.name)+'<br><b>'+t.m1.reg+'</b></p><p>'+esc(t.m2.name)+'<br><b>'+t.m2.reg+'</b></p>'
   + '<div class="sub">'+fmt(t.time)+'</div></div>'
   + '<div class="row"><button id="sp">Save as PDF</button><button class="s" id="dn">Done</button></div>'
   + '<p class="sub">Tip: take a screenshot of this screen as proof.</p>';
  $('sp').onclick = () => slipPdf(t);
  $('dn').onclick = () => { c.classList.add('hide'); $('regView').classList.remove('hide'); sel=null; ['r1','r2'].forEach(i=>$(i).value=''); ['w1','w2'].forEach(i=>$(i).textContent=''); load(); };
}
function slipPdf(t){
  const d = new jspdf.jsPDF(); d.setFont(undefined,'bold').setFontSize(14).text('Seminar Topic Confirmation',105,20,{align:'center'});
  d.setFontSize(11).setFont(undefined,'normal').text('UAZ4MC01 - Environmental Biology | II UG (25-UAZ)',105,28,{align:'center'});
  d.autoTable({startY:38, theme:'grid', body:[['Registration ID',t.id],['Topic',t.topic],['Member 1',t.m1.reg+'  '+t.m1.name],['Member 2',t.m2.reg+'  '+t.m2.name],['Time',fmt(t.time)]], columnStyles:{0:{fontStyle:'bold',cellWidth:40}}});
  d.save('Confirmation_'+t.id+'.pdf');
}
$('chk').onclick = async () => {
  const o = $('cres'); o.className='who';
  try{
    const r = await api({action:'lookup', reg:$('cr').value}); $('cr').value = r.reg;
    o.innerHTML = r.team ? '<b>'+esc(r.name)+'</b><br>Team '+r.team.id+' · Topic '+r.team.topicNo+': '+esc(r.team.topic)+'<br>Partner: '+esc(r.team.m1.reg===r.reg ? r.team.m2.name : r.team.m1.name)
                         : esc(r.name)+' — not registered yet.';
  }catch(e){ o.className='who bad'; o.textContent = e.message; }
};
load(); setInterval(()=>{ if(!$('regView').classList.contains('hide') && !document.hidden) load(); }, 20000);

/* ---------- ADMIN ---------- */
let A = null, O = null, PLAN = null, PMODE = 'random';
const adm = (op, x={}) => api({action:'admin', role:A.role, pass:A.pass, op, ...x});
async function refresh(){ O = await adm('overview'); drawAdmin(); }
async function act(fn){ try{ await fn(); await refresh(); }catch(e){ alert(e.message); } }
$('lbtn').onclick = async () => {
  A = {role:$('role').value, pass:$('pass').value}; $('lerr').textContent = '';
  try{ await refresh(); $('login').classList.add('hide'); $('panel').classList.remove('hide'); }
  catch(e){ A = null; $('lerr').textContent = e.message; }
};
const can = p => O.perms.includes(p);
function drawAdmin(){
  const s = O.settings, free = O.topics.filter(t=>!t.team);
  const roleName = {admin:'Admin', leader:'Class Leader', staff:'Staff In-charge'}[O.role];
  let h = '<div class="card"><div class="row" style="margin:0;align-items:center"><b>'+roleName+'</b><button class="s m" onclick="refresh().catch(e=>alert(e.message))">Refresh</button><button class="s m" onclick="location.reload()">Logout</button></div>'
   + '<div class="stats" style="margin-top:10px"><div><b>'+O.teams.length+'</b>Teams</div><div><b>'+O.unreg.length+'</b>Unregistered</div><div><b>'+free.length+'</b>Free topics</div></div></div>';

  if(can('settings')) h += '<div class="card"><h2>Registration window</h2>'
   + '<label class="f">Mode</label><select id="sm"><option value="auto">Auto (use open/close time)</option><option value="open">Open now (manual)</option><option value="closed">Closed (manual)</option></select>'
   + '<label class="f">Open time</label><input type="datetime-local" id="so" value="'+toLocal(s.openAt)+'">'
   + '<label class="f">Close time</label><input type="datetime-local" id="sc" value="'+toLocal(s.closeAt)+'">'
   + '<button style="margin-top:10px" id="ssave">Save</button></div>';

  h += '<div class="card"><h2>Topics &amp; teams</h2><div class="scroll"><table><tr><th>#</th><th>Topic</th><th>Team</th><th></th></tr>'
   + O.topics.map(t => '<tr><td>'+t.no+'</td><td>'+esc(t.name)+'</td><td>'+(t.team ? esc(t.team.m1.reg)+' '+esc(t.team.m1.name)+'<br>'+esc(t.team.m2.reg)+' '+esc(t.team.m2.name)+'<br><small>'+t.team.id+' · '+t.team.source+'</small>' : '<i>free</i>')+'</td>'
     + '<td>'+(t.team && can('teams') ? '<button class="m s" onclick="mv(\''+t.team.id+'\')">Move</button> <button class="m d" onclick="rm(\''+t.team.id+'\')">Remove</button>' : '')+'</td></tr>').join('')
   + '</table></div></div>';

  if(can('teams')) h += '<div class="card"><h2>Add team manually</h2><input id="ar1" placeholder="Member 1: 25-UAZ-001"><input id="ar2" placeholder="Member 2: 25-UAZ-002" style="margin-top:8px">'
   + '<select id="at" style="margin-top:8px">'+free.map(t=>'<option value="'+t.no+'">'+t.no+'. '+esc(t.name.slice(0,60))+'</option>').join('')+'</select>'
   + '<button style="margin-top:8px" id="aadd">Add team</button></div>';

  h += '<div class="card"><h2>Not yet registered ('+O.unreg.length+')</h2><div class="sub">'+(O.unreg.map(u=>esc(u.reg.slice(-3))+' '+esc(u.name)).join(' · ')||'Everyone is registered 🎉')+'</div></div>';

  if(can('allot')) h += '<div class="card"><h2>Auto-allot</h2><div class="sub">Pairs unregistered students and gives them the remaining topics. Preview first.</div>'
   + '<select id="pm"><option value="random">Random</option><option value="order">By register number order</option></select>'
   + '<div class="row"><button id="pv">Preview</button><button class="s" id="pa" '+(PLAN?'':'disabled')+'>Apply this plan</button></div><div id="plan" class="scroll" style="margin-top:10px"></div></div>';

  h += '<div class="card"><h2>PDF reports</h2><div class="row" style="margin-top:0"><button onclick="pdf(\'topic\')">By topic</button><button onclick="pdf(\'reg\')">By register no.</button></div></div>';

  if(can('log')) h += '<div class="card"><h2>Activity log</h2><div class="scroll" style="max-height:340px;overflow-y:auto"><table><tr><th>Time</th><th>Who</th><th>Action</th><th>Details</th></tr>'
   + (O.log||[]).map(l=>'<tr><td>'+fmt(l.time)+'</td><td>'+esc(l.actor)+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.details)+'</td></tr>').join('')+'</table></div></div>';

  if(can('reset')) h += '<div class="card"><h2>Danger zone</h2><button class="d" id="rst">Reset all registrations</button></div>';
  $('panel').innerHTML = h;

  if($('sm')){ $('sm').value = s.mode; $('ssave').onclick = () => act(() => adm('settings', {mode:$('sm').value, openAt:$('so').value ? new Date($('so').value).getTime() : '', closeAt:$('sc').value ? new Date($('sc').value).getTime() : ''}).then(()=>alert('Saved'))); }
  if($('aadd')) $('aadd').onclick = () => act(() => adm('addTeam', {reg1:$('ar1').value, reg2:$('ar2').value, topicNo:$('at').value}));
  if($('pv')){ $('pm').value = PMODE; $('pv').onclick = preview; $('pa').onclick = apply; if(PLAN) showPlan(); }
  if($('rst')) $('rst').onclick = () => { if(prompt('Type RESET to delete ALL registrations') === 'RESET') act(() => adm('reset')); };
}
const rm = id => confirm('Remove team '+id+'?') && act(() => adm('removeTeam', {id}));
const mv = id => { const n = prompt('Move to topic number (if taken, topics are swapped):'); if(n) act(() => adm('moveTeam', {id, topicNo:n})); };
async function preview(){
  PMODE = $('pm').value;
  try{ PLAN = (await adm('preview', {mode:PMODE})).plan; $('pa').disabled = false; showPlan(); }catch(e){ PLAN = null; $('pa').disabled = true; $('plan').innerHTML = '<span class="bad">'+esc(e.message)+'</span>'; }
}
function showPlan(){
  $('plan').innerHTML = '<table><tr><th>Topic</th><th>Members</th></tr>'+PLAN.map(p=>'<tr><td>'+p.topicNo+'. '+esc(p.topic)+'</td><td>'+esc(p.reg1)+' '+esc(p.name1)+'<br>'+esc(p.reg2)+' '+esc(p.name2)+'</td></tr>').join('')+'</table>';
}
function apply(){
  if(!PLAN || !confirm('Apply this allotment for '+PLAN.length+' teams?')) return;
  act(async () => { await adm('apply', {plan:PLAN, mode:PMODE}); PLAN = null; });
}

/* ---------- PDFs ---------- */
function pdfHead(d, sub){
  const W = d.internal.pageSize.getWidth();
  d.setFont(undefined,'bold').setFontSize(13).text('LOYOLA COLLEGE (AUTONOMOUS), CHENNAI - 600034',W/2,14,{align:'center'});
  d.setFontSize(10).text('PG & RESEARCH DEPARTMENT OF ADVANCED ZOOLOGY AND BIOTECHNOLOGY',W/2,20,{align:'center'});
  d.setFont(undefined,'normal').text('UAZ4MC01 - ENVIRONMENTAL BIOLOGY (MC-THEORY)  |  CLASS: II UG - 25UAZ BATCH',W/2,26,{align:'center'});
  d.setFont(undefined,'bold').setFontSize(11).text(sub,W/2,34,{align:'center'});
  d.setFont(undefined,'normal').setFontSize(9).text('Generated: '+new Date().toLocaleString('en-IN'),W-14,40,{align:'right'});
}
function pdf(kind){
  const d = new jspdf.jsPDF(), st = {fontSize:9, cellPadding:2}, hd = {fillColor:[31,107,69]};
  if(kind === 'topic'){
    pdfHead(d, 'Seminar Topic Allotment - Topic-wise');
    d.autoTable({startY:44, styles:st, headStyles:hd, head:[['S.No','Topic','Member 1','Member 2']],
      body:O.topics.map(t=>[t.no, t.name, t.team ? t.team.m1.reg+'\n'+t.team.m1.name : '-', t.team ? t.team.m2.reg+'\n'+t.team.m2.name : '-']),
      columnStyles:{0:{cellWidth:12},1:{cellWidth:68}}});
    if(O.unreg.length){
      d.setFont(undefined,'bold').text('Not allotted ('+O.unreg.length+')', 14, d.lastAutoTable.finalY+8);
      d.autoTable({startY:d.lastAutoTable.finalY+11, styles:st, headStyles:hd, head:[['Reg. No','Name']], body:O.unreg.map(u=>[u.reg,u.name])});
    }
  } else {
    pdfHead(d, 'Seminar Topic Allotment - Register Number-wise');
    const by = {}; O.teams.forEach(t => { by[t.m1.reg] = [t, t.m2]; by[t.m2.reg] = [t, t.m1]; });
    d.autoTable({startY:44, styles:st, headStyles:hd, head:[['S.No','Reg. No','Name','Topic','Partner']],
      body:O.roster.slice().sort((a,b)=>a.reg.localeCompare(b.reg)).map((r,i)=>{ const x = by[r.reg]; return [i+1, r.reg, r.name, x ? x[0].topicNo+'. '+x[0].topic : 'Not allotted', x ? x[1].name : '-']; }),
      columnStyles:{0:{cellWidth:12},3:{cellWidth:62}}});
  }
  d.save(kind === 'topic' ? 'Seminar_by_topic.pdf' : 'Seminar_by_regno.pdf');
  adm('pdflog', {kind}).catch(()=>{});
}
</script>
</body>
</html>
